services:

  cpp-dev:
    build:
      # Load current project directory as context
      context: .
      args:
        USERNAME: karnveer
        USER_UID: 1000
        USER_GID: 1000

    volumes:
      # Project source code
      - .:/home/karnveer/Development/project
      # Git identity
      - ~/.gitconfig:/home/karnveer/.gitconfig:ro
      # SSH agent forwarding
      - ~/.ssh:/home/karnveer/.ssh:ro

    working_dir:
      /home/karnveer/Development/project

    stdin_open: true

    tty: true

    environment:
      - DISPLAY=host.docker.internal:0
      - SDL_VIDEODRIVER=x11
      - SDL_VIDEO_X11_FORCE_EGL=1